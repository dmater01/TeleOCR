name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check infer.py TeleOCR tests
      - run: python -m compileall -q infer.py TeleOCR TeleOCR-vllm/TeleOCR_vllm
      - run: pytest -q
      - run: python -m build

  cpu-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv pip sync --system --torch-backend cpu requirements-cpu-lock.txt
      - run: uv pip install --system --no-deps -e .
      - run: python -m pytest -q
      - run: python -c "import torch; assert torch.__version__.endswith('+cpu'); assert not torch.cuda.is_available()"

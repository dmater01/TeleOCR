[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TeleOCR"
version = "1.0.0"
description = "TELEOCR inference package with Transformers and vLLM plugin support."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

dependencies = [
    # basic
    "pillow>=11,<12",
    "numpy>=2.2,<2.3",
    "opencv-python-headless>=4.12,<5",
    "pypdfium2>=4.30,<5",
    "pymupdf>=1.26,<2",
    "pypdf>=6,<7",
    "reportlab>=4.4,<5",
    "loguru>=0.7,<1",
    "tqdm>=4.67,<5",

    # local/remote resource loading
    "aiofiles>=24,<25",
    "httpx>=0.28,<1",
    "pydantic>=2.13,<3",

    # utils
    "fast-langdetect>=0.2,<0.3",
    "magika>=1.0,<2",
]


[project.optional-dependencies]

transformers = [
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "transformers>=4.57,<4.58",
    "tokenizers>=0.22,<0.23",
    "accelerate>=1.12,<2",
    "safetensors>=0.7,<0.8",
    "qwen-vl-utils>=0.0.14,<0.1",
]

vllm = [
    "vllm>=0.11,<0.12",
    "xformers>=0.0.32,<0.0.33",
    "transformers>=4.57,<4.58",
]

server = [
    "fastapi>=0.128,<1",
    "uvicorn>=0.40,<1",
    "python-multipart>=0.0.21,<1",
    "gradio>=5.49,<6",
]

dev = [
    "build>=1.3,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]

all = [
    "TeleOCR[transformers,vllm,server]",
]


[project.entry-points."vllm.general_plugins"]
TeleOCR_vllm = "TeleOCR_vllm:register"


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
where = [".", "TeleOCR-vllm"]
include = [
    "TeleOCR*",
    "TeleOCR_vllm*",
]
exclude = [
    "TeleOCR-vllm",
    "TeleOCR-vllm.*",
]


[tool.setuptools.package-data]
"*" = [
    "*.json",
    "*.jinja",
    "*.txt",
    "*.yaml",
    "*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F"]
ignore = ["F401", "F841"]
